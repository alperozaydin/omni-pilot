# USDA FoodData Central API key
usda_api_key: "YOUR_USDA_API_KEY_HERE"

# Output preferences
output:
  show_amino_acids: true
  show_ok_nutrients: true

# Gemini API configuration for smart food translation (Optional but recommended)
gemini_api_key: "YOUR_GEMINI_API_KEY_HERE"
# gemini_model: "gemini-flash-latest"  # default: gemini-flash-latest

# Storage paths (supports ~ and absolute/relative paths)
database_path: "db/food_db.json"
mappings_path: "config/food_mappings.yaml"
# Optional custom food recipes (see config/custom_foods.example.yaml)
custom_foods_path: "config/custom_foods.yaml"
# S3 storage for the database, mappings and custom foods (create the bucket with infra/).
# Alternative for cloud sessions: the OMNI_PILOT_S3_BUCKET, OMNI_PILOT_S3_REGION,
# OMNI_PILOT_S3_ACCESS_KEY_ID and OMNI_PILOT_S3_SECRET_ACCESS_KEY environment variables.
# s3:
#   bucket: "omni-pilot-data"
#   region: "eu-central-1"
#   access_key_id: "YOUR_ACCESS_KEY_ID"
#   secret_access_key: "YOUR_SECRET_ACCESS_KEY"
