# =============================================================================
# Micronutrient Reference Ranges
# =============================================================================
# Sources:
#   - Targets: DGE/ÖGE reference values, 3rd edition (Sept 2025), checked
#     against the erratum of May 2026 (dge.de/wissenschaft/referenzwerte)
#   - Where DGE gives no value: NIH Office of Dietary Supplements (ods.od.nih.gov)
#   - Upper limits (ul): NIH for every nutrient, since DGE sets none
#   - Amino acids: FAO/WHO/UNU Expert Consultation on Protein and Amino Acid
#     Requirements (2007)
#
# Terminology:
#   rda  = recommendation (DGE Empfehlung, NIH Recommended Dietary Allowance):
#          meets the needs of 97-98% of healthy individuals
#   ai   = estimate or guide value (DGE Schätzwert / Richtwert, NIH Adequate
#          Intake): used when a recommendation cannot be derived
#   ul   = Tolerable Upper Intake Level (max daily intake unlikely to cause harm)
#   null = not established / not applicable
#
# Default values below are for: men aged 25 to under 51 (DGE's age group)
# Adjust demographic section to match your profile.
# =============================================================================

demographic:
  sex: "male"            # fill in: "male" or "female"
  age_group: "31-50"      # fill in: e.g. "19-30", "31-50", "51-70"
  body_weight_kg: 75    # fill in: your body weight in kg (needed for amino acid targets)

# -----------------------------------------------------------------------------
# Vitamins
# -----------------------------------------------------------------------------
nutrients:
  vitamin_a_mcg:
    name: "Vitamin A"
    unit: "mcg"
    type: "rda"
    rda: 850  # retinol activity equivalent
    ul: 3000
    source: "DGE"

  vitamin_c_mg:
    name: "Vitamin C"
    unit: "mg"
    type: "rda"
    rda: 110
    ul: 2000
    source: "DGE"

  vitamin_d_mcg:
    name: "Vitamin D"
    unit: "mcg"
    type: "ai"
    ai: 20  # without endogenous synthesis
    ul: 100
    source: "DGE"

  vitamin_e_mg:
    name: "Vitamin E"
    unit: "mg"
    type: "ai"
    ai: 8  # RRR-alpha-tocopherol (NIH: 15)
    ul: 1000
    source: "DGE"

  vitamin_k_mcg:
    name: "Vitamin K"
    unit: "mcg"
    type: "ai"
    ai: 70
    ul: null          # not established
    source: "DGE"

  b1_thiamine_mg:
    name: "Vitamin B1 (Thiamine)"
    unit: "mg"
    type: "rda"
    rda: 1.2
    ul: null          # not established
    source: "DGE"

  b2_riboflavin_mg:
    name: "Vitamin B2 (Riboflavin)"
    unit: "mg"
    type: "rda"
    rda: 1.4
    ul: null          # not established
    source: "DGE"

  b3_niacin_mg:
    name: "Vitamin B3 (Niacin)"
    unit: "mg"
    type: "rda"
    rda: 15  # niacin equivalents; USDA's preformed niacin can only understate
    ul: 35
    source: "DGE"

  b5_pantothenic_acid_mg:
    name: "Vitamin B5 (Pantothenic Acid)"
    unit: "mg"
    type: "ai"
    ai: 5
    ul: null          # not established
    source: "DGE"

  b6_pyridoxine_mg:
    name: "Vitamin B6 (Pyridoxine)"
    unit: "mg"
    type: "rda"
    rda: 1.6
    ul: 100
    source: "DGE"

  b12_cobalamin_mcg:
    name: "Vitamin B12 (Cobalamin)"
    unit: "mcg"
    type: "ai"
    ai: 4.0
    ul: null          # not established
    source: "DGE"

  folate_mcg:
    name: "Folate"
    unit: "mcg"
    type: "rda"
    rda: 300  # folate equivalents; food folate counts the same
    ul: 1000
    source: "DGE"

# -----------------------------------------------------------------------------
# Minerals
# -----------------------------------------------------------------------------
  calcium_mg:
    name: "Calcium"
    unit: "mg"
    type: "rda"
    rda: 1000
    ul: 2500
    source: "DGE"

  iron_mg:
    name: "Iron"
    unit: "mg"
    type: "rda"
    rda: 11
    ul: 45
    source: "DGE"

  zinc_mg:
    name: "Zinc"
    unit: "mg"
    type: "rda"
    rda: 14  # moderate phytate intake (DGE: 11 low, 16 high)
    ul: 40
    source: "DGE"

  magnesium_mg:
    name: "Magnesium"
    unit: "mg"
    type: "ai"
    ai: 350
    ul: null           # UL of 350mg applies only to supplements, not food
    source: "DGE"
    note: "NIH's UL (350mg) applies to supplemental magnesium only, not dietary intake."

  manganese_mg:
    name: "Manganese"
    unit: "mg"
    type: "ai"
    ai: 2.0  # lower bound of DGE's 2.0-5.0 range
    ul: 11
    source: "DGE"

  phosphorus_mg:
    name: "Phosphorus"
    unit: "mg"
    type: "ai"
    ai: 550
    ul: 4000
    source: "DGE"

  potassium_mg:
    name: "Potassium"
    unit: "mg"
    type: "ai"
    ai: 4000
    ul: null          # not established
    source: "DGE"

  selenium_mcg:
    name: "Selenium"
    unit: "mcg"
    type: "ai"
    ai: 70
    ul: 400
    source: "DGE"

  copper_mg:
    name: "Copper"
    unit: "mg"
    type: "ai"
    ai: 1.0  # lower bound of DGE's 1.0-1.5 range
    ul: 10
    source: "DGE"

  sodium_mg:
    name: "Sodium"
    unit: "mg"
    type: "ai"
    ai: 1500
    ul: 2300            # chronic disease risk reduction intake (CDRR)
    source: "DGE"
    note: "DGE estimate is 1500mg. UL here is NIH's chronic disease risk reduction intake (CDRR): intake above 2300mg increases chronic disease risk."

# -----------------------------------------------------------------------------
# Other
# -----------------------------------------------------------------------------
  fiber_g:
    name: "Fiber"
    unit: "g"
    type: "ai"
    ai: 30              # DGE: at least 30 g/day for adults (NIH: 38 g for males ≤50)
    ul: null            # not established
    source: "DGE"
    note: "DGE: at least 30g/day for adults. NIH: 38g for males ≤50, 30g for males >50."

  choline_mg:
    name: "Choline"
    unit: "mg"
    type: "ai"
    ai: 550  # DGE gives no value
    ul: 3500
    source: "NIH"

  omega3_ala_g:
    name: "Omega-3 (ALA)"
    unit: "g"
    type: "ai"
    ai: 1.6  # DGE gives 0.5% of energy, no gram value
    ul: null            # not established
    source: "NIH"

  omega3_epa_dha_mg:
    name: "Omega-3 (EPA + DHA)"
    unit: "mg"
    type: "ai"
    ai: 250             # general recommendation from health organizations
    ul: null            # not established
    source: "AHA / EFSA"
    note: "No DGE value for adults and no NIH RDA. 250-500mg/day widely recommended for heart health."

# -----------------------------------------------------------------------------
# Amino Acids (Essential)
# -----------------------------------------------------------------------------
# WHO/FAO/UNU values are in mg per kg body weight per day.
# The analyzer multiplies these by body_weight_kg from the demographic section.
# "Safe" intake is ~24% above average requirement to cover individual variation.
# -----------------------------------------------------------------------------
  histidine_g:
    name: "Histidine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 10       # average requirement
    safe_mg_per_kg: 12  # ~24% above average
    ul: null
    source: "FAO/WHO/UNU 2007"

  isoleucine_g:
    name: "Isoleucine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 20
    safe_mg_per_kg: 25
    ul: null
    source: "FAO/WHO/UNU 2007"

  leucine_g:
    name: "Leucine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 39
    safe_mg_per_kg: 48
    ul: null
    source: "FAO/WHO/UNU 2007"

  lysine_g:
    name: "Lysine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 30
    safe_mg_per_kg: 37
    ul: null
    source: "FAO/WHO/UNU 2007"

  methionine_cysteine_g:
    name: "Methionine + Cysteine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 15
    safe_mg_per_kg: 19
    ul: null
    source: "FAO/WHO/UNU 2007"
    note: "Combined requirement. MacroFactor logs these separately — analyzer sums them."

  phenylalanine_tyrosine_g:
    name: "Phenylalanine + Tyrosine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 25
    safe_mg_per_kg: 31
    ul: null
    source: "FAO/WHO/UNU 2007"
    note: "Combined requirement. MacroFactor logs these separately — analyzer sums them."

  threonine_g:
    name: "Threonine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 15
    safe_mg_per_kg: 19
    ul: null
    source: "FAO/WHO/UNU 2007"

  tryptophan_g:
    name: "Tryptophan"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 4
    safe_mg_per_kg: 5
    ul: null
    source: "FAO/WHO/UNU 2007"

  valine_g:
    name: "Valine"
    unit: "g"
    type: "who_per_kg"
    mg_per_kg: 26
    safe_mg_per_kg: 32
    ul: null
    source: "FAO/WHO/UNU 2007"
